server {
  listen 80;
  server_name _;

  # 靜態頁面
  root /usr/share/nginx/html;
  index index.html;

  # 不快取 HTML（避免舊頁面）
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # 雜湊檔案長快取
  location ~* \.(?:js|mjs|css|png|jpg|jpeg|gif|webp|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
  }

  # ===== REST API 轉發 =====
  # 改用 docker compose 的 service 名稱 backend, port 是容器內的 8080
  location /api/users {
    proxy_pass http://backend:8080/api/users; 
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  } 

  location /api/auth/ {
    proxy_pass http://backend:8080/api/auth/; 
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /api/ {
    proxy_pass http://backend:8080; 
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # ===== WebSocket /ws-monitoring 轉發 =====
  location /ws-monitoring {
    proxy_pass http://backend:8080;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;         
    proxy_set_header Connection "Upgrade";          
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
    proxy_send_timeout 86400s;
    proxy_buffering off;
  }

  # ===== Telegram API 轉發 =====
  # Telegram 是外部主機 (61.216.140.11:9081), 不在 docker network 裡
  # 所以這裡保留 host.docker.internal, 透過 extra_hosts 走宿主機出去
  location /tg/ {
    proxy_pass http://host.docker.internal:9081/;
    proxy_set_header Origin "";       
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # SPA：其餘路徑回到 index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 壓縮
  gzip on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}