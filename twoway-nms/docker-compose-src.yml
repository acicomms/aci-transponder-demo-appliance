  backend:
    build:
      context: ./NMSbackend
      dockerfile: Dockerfile.src.backend
    image: nms-backend:latest
    container_name: nms-backend
    restart: always
    ports:
      - "9090:8080"
    depends_on:
      - db
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: Asia/Taipei
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: auth_user
      DB_PASSWORD: auth_password

      # use name
      MQTT_BROKER_URL: tcp://mosquitto:1883
      CHIRPSTACK_HOST: chirpstack
      CHIRPSTACK_PORT: "8080"

