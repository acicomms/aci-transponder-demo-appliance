      LINE_SECRET: ""
      LINE_CALLBACK_URL: "http://localhost:9080/callback"
      GOOGLE: ""
      GOOGLE_SECRET: ""
      FACEBOOK: ""
      FACEBOOK_SECRET: ""
      FACEBOOK_REDIRECT_URI: "http://localhost:9080/auth/facebook/callback"
    networks:
      - nms-network
      - demo-net

  db:
    image: mysql:8.0
    container_name: nms-db
    restart: always
    ports:
      - "3307:3306"
    environment:
      TZ: Asia/Taipei
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: auth_db
      MYSQL_USER: auth_user
      MYSQL_PASSWORD: auth_password
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - nms-network

  frontend:
    build:
      context: ./NMSfrontend
      dockerfile: Dockerfile.src.frontend
    image: nms-frontend:latest
    container_name: nms-frontend
    restart: unless-stopped
    ports:
      - "9080:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - TZ=Asia/Taipei
    depends_on:
      - backend
    networks:
      - nms-network

networks:
  nms-network:
    driver: bridge
  demo-net:               # add
    # name: demo_lora-net   # chirpstack network
    name: chirpstack-docker_lora-net
    external: true

volumes:
  mysql-data:

